name: ci
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pg, POSTGRES_DB: forge}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e app pytest
      - run: pytest app/tests -q                 # SQLite
      - run: pytest app/tests -q                 # Postgres
        env: {TEST_DATABASE_URL: "postgresql://postgres:pg@localhost:5432/forge"}
      - run: cd app && forge validate
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: deploy/aws
      - run: terraform init -backend=false && terraform validate
        working-directory: deploy/aws
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=x docker compose -f deploy/local/docker-compose.yml config -q
