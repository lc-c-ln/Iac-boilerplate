# 포트원 본인인증 가입 버전. 파일명을 '_' 없이 바꾸면 활성화된다.
slug: club-verified
name: 성인 모임
topic: 본인인증 기반 1인 1계정 커뮤니티
entities:
  - {key: meetup, label: 모임, fields: [{name: title, required: true}, {name: place}]}
auth:
  provider: portone
  portone:
    store_id: store-xxxxxxxx        # 포트원 콘솔 > 상점 ID
    channel_key: channel-key-xxxxxxxx   # 본인인증 채널 키
    min_age: 19                      # 0이면 연령 제한 없음
